name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create from the selected commit, e.g. v0.1.0"
        required: true
        type: string

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: Package and GitHub release
    runs-on: ubuntu-24.04
    steps:
      - name: Check version format
        run: |
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'${VERSION}' is not a vX.Y.Z tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -e '.[dev]' build==1.6.1
          python -m pytest -q
      - name: Build
        run: |
          set -euo pipefail
          python -m build
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" dist/* \
            --target "${GITHUB_SHA}" --title "${VERSION}" --generate-notes
