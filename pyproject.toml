[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-diag-mcp"
version = "0.1.0"
description = "A read-only MCP server for Linux diagnostics over stdio: load, memory, disks, processes, ports, services, journal and allowlisted log files. Standard library only, strict argument validation, capped and redacted output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eren Özgü" }]
keywords = ["mcp", "model-context-protocol", "linux", "diagnostics", "sysadmin", "devops"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# The official SDK is used by the tests as an independent client of the server. It is not needed to run it.
sdk = ["mcp>=1.30"]

[project.scripts]
linux-diag-mcp = "linux_diag_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["linux_diag_mcp*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"linux_diag_mcp/*" = ["E501"]
"tests/*" = ["E501"]
"examples/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
